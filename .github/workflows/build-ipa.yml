name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (senza firma)
        run: |
          xcodebuild -project SulcisOca.xcodeproj -target SulcisOca -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - name: Impacchetta IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SulcisOca.app Payload/
          zip -qry SulcisOca-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SulcisOca-ipa
          path: SulcisOca-unsigned.ipa
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SulcisOca iOS 1.0.${{ github.run_number }}
          make_latest: true
          files: SulcisOca-unsigned.ipa
          body: |
            **SulcisOca-unsigned.ipa**: IPA non firmata. Va firmata/installata con AltStore, SideStore, Sideloadly o simili.
            Il gioco funziona tutto offline, senza server.
